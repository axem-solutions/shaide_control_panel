name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  validate:
    name: Lint, Types, Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # `next build` only type-checks files reachable from the app, so test
      # files need an explicit tsc pass — this is what the pre-push hook runs.
      - name: Check types
        run: npm run check-types

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
